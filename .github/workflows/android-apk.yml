# ============================================================================
#  ساخت خودکار فایل APK اپ اندروید (در سرورهای گیت‌هاب — نیازی به Android Studio نیست)
#
#  چرا این‌جا؟ فایل‌های سایت (index.html و پوشه‌های core/ و modules/) هنگام ساخت
#  APK داخل خودش بسته‌بندی می‌شوند؛ پس برای دیدن تغییرات در اپ، باید APK تازه
#  ساخته و نصب شود. این ورک‌فلو همان کار را انجام می‌دهد.
#
#  نتیجه کجاست؟ Actions → آخرین اجرا → بخش Artifacts → فایل
#  «eplak-apk» (یا در صفحه‌ی Releases به‌عنوان پیوست).
# ============================================================================
name: Build Android APK

on:
  push:
    branches:
      - main
      - 'arena/**'
    paths:
      - 'android-app/**'
      - 'index.html'
      - 'app.js'
      - 'core/**'
      - 'modules/**'
      - 'views/**'
      - 'assets/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: دریافت کد
        uses: actions/checkout@v5

      - name: نصب Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: کش کلید امضای اپ (تا نسخه‌ی تازه روی نسخه‌ی نصب‌شده نصب شود)
        uses: actions/cache@v4
        with:
          path: ~/.android
          key: eplak-android-signing-v1

      - name: بررسی Android SDK موجود در سرور
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platforms" 2>/dev/null || true
          ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" 2>/dev/null || true
          ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}/licenses" 2>/dev/null || true

      - name: بررسی وجود کلید فایربیس
        id: firebase
        run: |
          if [ -f android-app/app/google-services.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=فایربیس::فایل google-services.json موجود است — اعلان گوشی (FCM) فعال ساخته می‌شود."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=فایربیس تنظیم نشده::فایل android-app/app/google-services.json وجود ندارد؛ APK ساخته می‌شود ولی اعلان در حالت بسته بودن اپ کار نمی‌کند (راهنما: docs/DEPLOY_UPDATE_FA.md بخش ۶)."
          fi

      - name: ساخت APK
        working-directory: android-app
        run: |
          set -o pipefail
          # مسیر SDKای که خود سرور گیت‌هاب فراهم می‌کند
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "sdk.dir=$SDK" > local.properties
          echo "استفاده از SDK: $SDK"
          chmod +x ./gradlew
          ./gradlew --version 2>&1 | tee "$RUNNER_TEMP/gradle.log"
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee -a "$RUNNER_TEMP/gradle.log"

      - name: انتشار خلاصه‌ی خطا (برای پیگیری)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LOG="$RUNNER_TEMP/gradle.log"
          {
            echo "## ❌ ساخت APK ناموفق بود — ۸۰ خط آخر لاگ"
            echo ''
            echo '```'
            tail -n 80 "$LOG" 2>/dev/null || echo '(لاگی ثبت نشد)'
            echo '```'
          } > /tmp/fail-comment.md
          gh pr comment 2 --body-file /tmp/fail-comment.md 2>/dev/null || true

      - name: نام‌گذاری فایل خروجی
        id: apk
        run: |
          SRC=$(find android-app/app/build/outputs/apk/debug -name '*.apk' | head -n 1)
          # نام ثابت و خوانا: لینک دانلود همیشه یکی می‌ماند
          cp "$SRC" eplak-app.apk
          echo "path=eplak-app.apk" >> "$GITHUB_OUTPUT"
          ls -la eplak-app.apk

      - name: بارگذاری فایل APK (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: eplak-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 90

      - name: پیوست کردن APK به Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0-eplak-update
          name: بسته‌ی به‌روزرسانی سایت و پنل ادمین (v2.0)
          files: eplak-app.apk
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
