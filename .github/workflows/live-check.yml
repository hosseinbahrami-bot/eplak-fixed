# ============================================================================
#  بررسی سایت زنده — از سرورهای گیت‌هاب (دسترسی آزاد به اینترنت)
#
#  چه می‌کند؟ فایل‌های عمومی سایت (مثلاً https://eplak.ir/eplak-fixed) را می‌خواند
#  و می‌گوید آیا آخرین نسخه (اعلان فایربیس و اصلاح «خوانده شدن» اعلان‌ها) روی
#  سایت اعمال شده است یا نه.
#
#  گزارش کجاست؟ تب Actions → همین اجرا، و همچنین Issue با عنوان
#  «گزارش بررسی سایت زنده (eplak.ir)».
# ============================================================================
name: بررسی سایت زنده

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'آدرس پایه‌ی سایت (پیش‌فرض: eplak.ir/eplak-fixed)'
        required: false
        default: 'https://eplak.ir/eplak-fixed'
      smoke:
        description: 'آزمون واقعی سرتاسری هم اجرا شود؟ (یک درخواست آزمایشی می‌سازد و پاک می‌کند)'
        type: boolean
        required: false
        default: false
  push:
    paths:
      - '.github/workflows/live-check.yml'
      - 'tools/live-check.sh'

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    name: خواندن فایل‌های سایت و بررسی نسخه
    steps:
      - uses: actions/checkout@v5

      - name: بررسی سایت
        continue-on-error: true
        env:
          SITE_URL: ${{ inputs.url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # آزمون واقعی سرتاسری: با اجرای دستی و تیک «smoke» یا با متغیر مخزن
          # EPLAK_RUN_SMOKE=1 فعال می‌شود (به‌صورت پیش‌فرض خاموش است تا روی
          # سایت داده‌ی آزمایشی ساخته نشود).
          EPLAK_SMOKE: '1'   # موقت برای همین اجرا؛ در کامیت بعدی به حالت پیش‌فرض (خاموش) برمی‌گردد
          # (اجرای فعلی: آزمون واقعی به‌صورت موقت روشن است)
        run: |
          URL="${SITE_URL:-https://eplak.ir/eplak-fixed}"
          echo "آدرس بررسی‌شده: $URL"
          bash tools/live-check.sh "$URL" > report.txt 2>&1 || true
          cat report.txt
          {
            echo "### گزارش بررسی سایت زنده"
            echo ""
            cat report.txt
          } >> "$GITHUB_STEP_SUMMARY"

      - name: ثبت گزارش در Issue
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="گزارش بررسی سایت زنده (eplak.ir)"
          BODY_FILE="$(mktemp)"
          {
            echo "خروجی خودکار بررسی سایت:"
            echo ""
            echo '```'
            cat report.txt
            echo '```'
          } > "$BODY_FILE"
          NUM="$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body-file "$BODY_FILE"
          else
            gh issue create --title "$TITLE" --body-file "$BODY_FILE"
          fi
