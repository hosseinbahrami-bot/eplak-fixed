# ============================================================================
#  تحویل موقت (یک‌بار مصرف): انتقال APK منتشرشده‌ی Releases به یک برچسب موقت گیت
#
#  چرا؟ دستیار برنامه‌نویس از محیط خودش به آدرس‌های دانلودِ Releases
#  (release-assets.githubusercontent.com) دسترسی ندارد، ولی به خودِ git دارد.
#  این ورک‌فلو APK را از Releases می‌گیرد و فقط داخل یک «برچسب» (tag) موقت می‌گذارد؛
#  دستیار آن را fetch و برای شما می‌فرستد و بعد برچسب و همین فایل حذف می‌شوند.
#  با تغییر tools/deliver/request.txt اجرا می‌شود؛ هیچ APK/نسخه‌ی تازه‌ای نمی‌سازد.
# ============================================================================
name: تحویل موقت فایل‌ها (حذف می‌شود)

on:
  push:
    branches:
      - 'arena/**'
    paths:
      - 'tools/deliver/request.txt'

permissions:
  contents: write

jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - name: دریافت کد
        uses: actions/checkout@v5

      - name: انتقال APK به برچسب موقت
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="$(sed -n '1p' tools/deliver/request.txt | tr -d '\r ')"
          REL="$(sed -n '2p' tools/deliver/request.txt | tr -d '\r ')"
          case "$TAG" in delivery-*) ;; *) echo "نام برچسب باید با delivery- شروع شود"; exit 1;; esac
          D="$RUNNER_TEMP/delivery"; rm -rf "$D"; mkdir -p "$D"; cd "$D"
          gh release download "$REL" --repo "$GITHUB_REPOSITORY" -p eplak-app.apk -p eplak-apk-info.txt
          sha256sum eplak-app.apk eplak-apk-info.txt > SHA256SUMS.txt
          ls -l; cat SHA256SUMS.txt
          git init -q -b delivery .
          git add .
          git -c user.name="github-actions" -c user.email="actions@github.com" commit -q -m "delivery of $REL"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin "HEAD:refs/tags/${TAG}"
          echo "✅ برچسب ${TAG} ساخته شد"
